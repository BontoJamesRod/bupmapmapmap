# BUPC Navi: campus place overrides
# Keys are stable IDs. NEVER rename a key once published; change `name` instead.
# Seeded 2026-11-07 from the OSM snapshot plus web research. Updated 2026-11-08 from a student's annotated map.
# Layout: `hallway: true` draws a hallway down the middle of the building, following its shape;
# `doors:` are [lng, lat] points (snapped onto the outline) joined straight to the hallway and the nearest road.
# Free-standing walkways that are not doors go in data/overrides/paths.geojson.
# See docs/04-data-model.md for the schema and docs/10-campus-data-inventory.md for the survey checklist.

