name: Bug report
description: Something in the app doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Samsung A14, Chrome 131
  - type: input
    id: version
    attributes:
      label: App / data version (from the About page)
